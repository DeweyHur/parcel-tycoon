<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>택배 타이쿤 자금 플로우 플래닝</title>
<style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e0;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--warn:#e34948}
body{margin:0;padding:20px 16px;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;max-width:900px;margin:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 6px}.sub{color:var(--ink2);font-size:12px;margin:0 0 12px}
svg{width:100%;height:auto;display:block}.lg{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:6px 0}.lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--grid)}th:first-child,td:first-child{text-align:left}th{color:var(--ink2);font-weight:500}
.note{background:#f4f3ee;border-radius:6px;padding:10px 12px;font-size:13px;margin-top:20px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--grid);border-radius:4px;padding:4px 8px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);display:none}
</style></head><body>
<h1>자금 플로우 플래닝 — 물량 성장·흡수 장치 이후</h1>
<p class="sub">반기(6개월) 시나리오 · 동네 택배 · 정규 · 봇 50시드 평균. 값은 <b>월말 정산 후 순자금</b>(부채 차감). 죽은 시드는 그 달 이후 평균에서 빠짐.</p>

<h2>월말 순자금</h2>
<div class="lg"><span><i style="background:var(--s1)"></i>마켓 무구매</span><span><i style="background:var(--s2)"></i>보통 구매 (용량 부족분만: 배차 추가·확장·업그레이드)</span><span><i style="background:var(--s3)"></i>공격적 구매 (여유 자금의 절반까지 더)</span></div>
<div style="position:relative"><svg id="c1" viewBox="0 0 860 300"></svg><div class="tip" id="t1"></div></div>

<h2>생존율</h2>
<div style="position:relative"><svg id="c2" viewBox="0 0 860 200"></svg><div class="tip" id="t2"></div></div>

<h2>월별 내역 (생존 시드 평균, c)</h2>
<table id="tbl"></table>

<div class="note" id="note"></div>
<script>
const R = [{"strat": "none", "win": 0, "deaths": {"3": 1, "4": 18, "5": 21}, "months": [{"m": 1, "alive": 1, "cash": 846, "rev": 819, "fees": 201, "op": 222, "spent": 0, "ret": 0, "stress": 0}, {"m": 2, "alive": 1, "cash": 1471, "rev": 1097, "fees": 237, "op": 225, "spent": 0, "ret": 0.6, "stress": 0.3}, {"m": 3, "alive": 0.975, "cash": 2532, "rev": 1709, "fees": 350, "op": 254, "spent": 0, "ret": 1.3, "stress": 3.7}, {"m": 4, "alive": 0.525, "cash": 3824, "rev": 2071, "fees": 381, "op": 282, "spent": 0, "ret": 3, "stress": 12.3}, {"m": 5, "alive": 0}, {"m": 6, "alive": 0}], "label": "마켓 무구매", "c": "var(--s1)"}, {"strat": "moderate", "win": 0.5, "months": [{"m": 1, "alive": 1, "cash": 580, "rev": 822, "fees": 201, "op": 232, "spent": 562, "ret": 0, "stress": 0}, {"m": 2, "alive": 1, "cash": 960, "rev": 1182, "fees": 261, "op": 238, "spent": 530, "ret": 0.1, "stress": 0}, {"m": 3, "alive": 1, "cash": 1673, "rev": 1917, "fees": 368, "op": 294, "spent": 983, "ret": 0.4, "stress": 0.8}, {"m": 4, "alive": 0.975, "cash": 2337, "rev": 2513, "fees": 420, "op": 382, "spent": 1218, "ret": 1.9, "stress": 4.1}, {"m": 5, "alive": 0.825, "cash": 3238, "rev": 3186, "fees": 455, "op": 508, "spent": 868, "ret": 1.8, "stress": 6.2}, {"m": 6, "alive": 0.5, "cash": 5458, "rev": 4091, "fees": 467, "op": 595, "spent": 0, "ret": 1.9, "stress": 6.2}], "label": "보통 구매", "c": "var(--s2)"}, {"strat": "aggressive", "win": 0.65, "months": [{"m": 1, "alive": 1, "cash": 373, "rev": 815, "fees": 199, "op": 248, "spent": 800, "ret": 0, "stress": 0}, {"m": 2, "alive": 1, "cash": 664, "rev": 1167, "fees": 259, "op": 261, "spent": 636, "ret": 0.1, "stress": 0}, {"m": 3, "alive": 1, "cash": 1241, "rev": 1921, "fees": 362, "op": 335, "spent": 1072, "ret": 0.5, "stress": 0.5}, {"m": 4, "alive": 0.975, "cash": 1745, "rev": 2502, "fees": 418, "op": 448, "spent": 951, "ret": 1.6, "stress": 3}, {"m": 5, "alive": 0.8, "cash": 3070, "rev": 3303, "fees": 453, "op": 545, "spent": 768, "ret": 1.5, "stress": 4.3}, {"m": 6, "alive": 0.65, "cash": 5120, "rev": 4096, "fees": 464, "op": 628, "spent": 0, "ret": 1.9, "stress": 6.9}], "label": "공격적 구매", "c": "var(--s3)"}];
const NS='http://www.w3.org/2000/svg', el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
function chart(svgId,tipId,key,ymax,fmt){
  const svg=document.getElementById(svgId), H=+svg.viewBox.baseVal.height, W=860, L=52,Rr=16,T=14,B=28;
  const x=m=>L+(m-1)*(W-L-Rr)/5, y=v=>T+(H-T-B)*(1-v/ymax);
  const steps=key==='alive'?[0,.5,1]:[0,1000,2000,3000,4000,5000,6000];
  for(const s of steps){svg.appendChild(el('line',{x1:L,x2:W-Rr,y1:y(s),y2:y(s),stroke:'#e6e5e0'}));const t=el('text',{x:L-6,y:y(s)+4,'text-anchor':'end','font-size':11,fill:'#52514e'});t.textContent=fmt(s);svg.appendChild(t);}
  for(let m=1;m<=6;m++){const t=el('text',{x:x(m),y:H-8,'text-anchor':'middle','font-size':11,fill:'#52514e'});t.textContent=m+'월';svg.appendChild(t);}
  const tip=document.getElementById(tipId);
  for(const r of R){const pts=r.months.filter(d=>d.alive>0||key==='alive').map(d=>[x(d.m),y(key==='alive'?d.alive:d[key]),d]);
    svg.appendChild(el('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '),fill:'none',stroke:r.c,'stroke-width':2,'stroke-linejoin':'round'}));
    for(const [px,py,d] of pts){const c=el('circle',{cx:px,cy:py,r:4,fill:r.c,stroke:'#fcfcfb','stroke-width':2});const hit=el('circle',{cx:px,cy:py,r:12,fill:'transparent'});
      hit.onmouseenter=e=>{tip.style.display='block';tip.innerHTML=`<b>${r.label}</b> ${d.m}월<br>${key==='alive'?'생존 '+Math.round(d.alive*100)+'%':'순자금 '+d.cash+'c · 생존 '+Math.round(d.alive*100)+'%'}${d.rev?`<br>수입 ${d.rev} · 배차비 ${d.fees} · 운영비+보험 ${d.op}${d.spent?' · 마켓 '+d.spent:''}`:''}`;};
      hit.onmousemove=e=>{const b=svg.getBoundingClientRect();tip.style.left=(e.clientX-b.left+12)+'px';tip.style.top=(e.clientY-b.top-10)+'px';};hit.onmouseleave=()=>tip.style.display='none';
      svg.appendChild(c);svg.appendChild(hit);}
    const last=pts[pts.length-1];const t=el('text',{x:last[0],y:last[1]+(key==='alive'?(r.strat==='moderate'?18:r.strat==='aggressive'?-10:-8):(r.strat==='aggressive'?16:-8)),'text-anchor':'middle','font-size':11,fill:'#0b0b0b'});t.textContent=key==='alive'?(r.strat==='none'?'전멸':Math.round(r.win*100)+'%'):last[2].cash+'c';svg.appendChild(t);}
}
chart('c1','t1','cash',6000,v=>v+'c');chart('c2','t2','alive',1,v=>Math.round(v*100)+'%');
const tbl=document.getElementById('tbl');let h='<tr><th>전략 / 월</th>'+[1,2,3,4,5,6].map(m=>`<th>${m}월</th>`).join('')+'</tr>';
for(const r of R){for(const [k,lab] of [['cash','순자금'],['rev','수입'],['fees','배차비'],['op','운영비+보험'],['spent','마켓 지출'],['ret','반송·폐기(개)'],['stress','스트레스']]){h+=`<tr><td>${lab===''?'':(k==='cash'?`<b>${r.label}</b> · `:'')}${lab}</td>`+r.months.map(d=>`<td>${d.alive>0?(d[k]??'-'):'—'}</td>`).join('')+'</tr>';}}
tbl.innerHTML=h;
document.getElementById('note').innerHTML=`<b>읽는 법</b><br>· <b>무구매</b>: 1~3월은 편하게 돈이 쌓이지만(3월 2,532c) 고객 신뢰가 오르며 물량이 불어나 4~5월에 반송으로 전멸. 돈으로 망하진 않지만 "안 사면 못 버틴다"는 성립.<br>· <b>보통 구매</b>: 매달 530~1,220c를 마켓에 넣는다(1~3월 수입의 60~70%, 4~5월 수입의 30~50%). 배차 추가·확장 가격이 살 때마다 오르고 프리미엄 유지비·인건비가 붙어 지출이 수입을 따라 큰다. 생존 50%.<br>· <b>공격적 구매</b>: 초반 잔고를 373c까지 쓰지만 생존 65% — 이제 <b>더 사는 쪽이 이긴다</b>. 남는 돈이 생존율로 바뀌는 구조.<br>· 5~6월 사망은 반송 스트레스(월 1.5~2건×2). 봇은 업체 특화를 못 바꿔서 특수 물품을 놓치는 약점이 있어 사람은 더 나올 것.`;
</script></body></html>
