<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1a2e">
  <title>God of the Dock</title>   <!-- applyStaticText() 가 언어에 맞는 제목으로 덮어쓴다 -->
  <link rel="icon" href="img/mark-icon.png">
  <link rel="stylesheet" href="css/style.css?v=901e332f">
</head>
<body class="no-game">
  <div id="app">
    <div id="scene">
      <div id="hud">
        <div class="hud-box" id="hud-left"><b id="hud-month" class="hl">1</b> <span id="hud-turn">1/10</span><br><span id="hud-cash-box"><span id="hud-cash-lbl">월말 예상</span> <b id="hud-cash">600</b>c <span id="hud-more">▾</span></span><br><span id="hud-due" style="font-size:11px;color:var(--dim)" hidden></span></div>
        <div class="hud-box" id="hud-right">
          <div id="stress-wrap"><span id="stress-label"></span><div class="gauge" id="stress-gauge"><i style="width:0%"></i></div><span id="stress-num">0</span></div>
          <div id="hud-perks" style="color:var(--dim);font-size:11px"></div>
        </div>
      </div>
      <div id="ops-status" aria-live="polite">
        <div class="ops-verdict">
          <span class="ops-signal" id="ops-signal"></span>
          <div><small id="ops-kicker"></small><b id="ops-title"></b></div>
        </div>
        <div class="ops-metrics">
          <div class="ops-metric"><span>📦</span><b id="ops-delivered">0</b><small id="ops-delivered-label"></small></div>
          <div class="ops-metric"><span>⚡</span><b id="ops-risk">0</b><small id="ops-risk-label"></small></div>
          <div class="ops-metric"><span>★</span><b id="ops-next">0</b><small id="ops-next-label"></small></div>
        </div>
        <div class="ops-progress"><i id="ops-progress-fill"></i><span id="ops-progress-label"></span></div>
        <div class="rush-meter" id="rush-meter" hidden>
          <span id="rush-icon">🔥</span><b id="rush-title"></b>
          <div><i id="rush-fill"></i></div><strong id="rush-label"></strong>
        </div>
        <div class="chain-meter" id="chain-meter" hidden>
          <span>⚡</span><b id="chain-title"></b><div><i id="chain-fill"></i></div><strong id="chain-label"></strong>
        </div>
        <div class="mission-meter" id="mission-meter">
          <b id="mission-grade">D</b><span id="mission-copy"></span><div class="mtrack"><i id="mission-fill"></i><i id="mission-tick-c" class="tick"></i><i id="mission-tick-b" class="tick"></i></div><strong id="mission-next"></strong>
        </div>
      </div>
      <div id="float-layer"></div>
      <div id="toast"></div>
    </div>
    <div id="panel">
      </div>
      <div id="upcoming"></div>
      <div id="call-head" hidden></div>
      <div id="warehouse-details">
        <div id="wxline" hidden></div>
        <div id="offer"></div>
        <div id="parcels"></div>
      </div>
      <div id="call-foot" class="foot" hidden></div>
      <div id="coach" hidden></div>
      <div id="actions">
        <div id="contract-strip">
          <button class="btn contract" id="c0"></button>
          <button class="btn contract" id="c1"></button>
          <button class="btn contract" id="c2"></button>
          <button class="btn contract" id="c3"></button>
          <button class="btn contract self" id="cself" hidden></button>
        </div>
        <div id="action-main">
          <button class="btn primary" id="wait-btn"></button>
          <div id="bottom-bar">
            <button class="btn small gold" id="invest-btn">투자</button>
            <button class="btn small" id="menu-btn">메뉴</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="modal-root"><div class="modal" id="modal"></div></div>
  <!-- 스토리 모드 대화창 (창고장 안내) · 계절 문자 -->
  <div id="story" hidden><div class="sbox"><img id="story-face" alt=""><div class="stext"><div class="shead"><span id="story-name"></span><button class="sskip" id="story-skip"></button></div><div class="sbody" id="story-body"></div><div class="sfoot"><span id="story-pages"></span><span class="scursor" id="story-cursor" hidden>▼</span><button class="btn small" id="story-cal" hidden></button><button class="btn small gold" id="story-next"></button></div></div></div></div>
  <div id="story-gate" hidden><div class="spoint" id="story-point"></div></div>
  <div id="sms" hidden><b id="sms-from"></b> <span id="sms-text"></span></div>

  <script src="js/three.min.js?v=bc138621"></script>
  <script src="js/build.js?v=8c173c51"></script>
  <script src="js/data.js?v=d3e2e6bb"></script>
  <script src="js/meta.js?v=b9270b44"></script>
  <script src="locales/ko.js?v=d86d15c3"></script>
  <script src="locales/en.js?v=4f33912a"></script>
  <script src="js/i18n.js?v=54e26e8e"></script>
  <script src="js/levels.js?v=14f2ca84"></script>
  <script src="js/tutorial.js?v=03140a40"></script>
  <script src="js/game.js?v=74739aa3"></script>
  <script src="js/story.js?v=234041ca"></script>
  <script src="js/storage.js?v=99e0ca7b"></script>
  <script src="js/profile.js?v=499e1d1c"></script>
  <script src="js/sfx.js?v=8bb9ab44"></script>
  <script src="js/bgm.js?v=a9c1ad7a"></script>
  <script src="js/splash.js?v=b3f1749a"></script>
  <script src="js/scene3d.js?v=4eee402b"></script>
  <script src="js/intro.js?v=699c94f0"></script>
  <script src="js/ui.js?v=9614b35e"></script>
</body>
</html>
